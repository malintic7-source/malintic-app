services:
  - type: web
    name: malintic-api
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATA_DIR
        value: /data
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@example.com
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        value: ChangeMe123!
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

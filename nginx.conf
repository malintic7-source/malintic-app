server {
    listen 80 default_server;
    server_name mntic_app.local mntic-app.local localhost _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 25M;

    # OWASP Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Performance: Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml application/octet-stream font/ttf font/otf font/woff font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy with full LAN and remote support
    location /api/ {
        proxy_pass http://api:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # HTML Shell & Bootstrap: Always check version with ETag
    location ~* ^/(?:index\.html|flutter_bootstrap\.js|version\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        etag on;
    }

    # Flutter Web bundles and engine files: Cache with revalidation
    location ~* \.(?:js|json)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        etag on;
    }

    # WebAssembly: versioned bundle — long-term cache
    location ~* \.wasm$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        etag on;
    }

    # Static assets caching (fonts, images, icons)
    location ~* \.(?:css|png|jpg|jpeg|gif|ico|svg|ttf|otf|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        etag on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

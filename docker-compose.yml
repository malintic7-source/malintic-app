name: gestion_formations
services:
  gestion_formations:
    build:
      context: .
      # Serve the prebuilt Flutter bundle from build/web with Nginx
      dockerfile: Dockerfile.fast
    container_name: gestion_formations_app
    ports:
      - "80:80"
      - "8080:80"
    restart: always
    init: true
    stop_grace_period: 15s
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gestion_formations_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gestion_formations_api
    restart: always
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATA_DIR=/data
    volumes:
      - gestion_formations_data:/data
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - gestion_formations_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: gestion_formations_ngrok
    restart: always
    init: true
    depends_on:
      gestion_formations:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Ajoutez NGROK_AUTHTOKEN dans le fichier .env}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-boil-prude-curry.ngrok-free.dev}
    command: http --domain=${NGROK_DOMAIN:-boil-prude-curry.ngrok-free.dev} http://gestion_formations_app:80
    networks:
      - gestion_formations_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gestion_formations_tunnel
    restart: always
    init: true
    depends_on:
      gestion_formations:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - gestion_formations_network

volumes:
  gestion_formations_data:
    driver: local

networks:
  gestion_formations_network:
    driver: bridge

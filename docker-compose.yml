name: malintic

services:
  app:
    image: malintic-app:latest
    build:
      context: .
      dockerfile: Dockerfile.fast
    container_name: malintic_app
    ports:
      - "80:80"
      - "8000:80"
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - malintic_network

  api:
    image: malintic-api:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: malintic_api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATA_DIR=/data
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    volumes:
      - malintic_data:/data
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5001/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - malintic_network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: malintic_ngrok
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    command: http --url=${NGROK_DOMAIN:?NGROK_DOMAIN doit être défini dans .env} http://malintic_app:80
    networks:
      - malintic_network

  supervisor:
    image: malintic-supervisor:latest
    build:
      context: ./supervisor
      dockerfile: Dockerfile
    container_name: malintic_supervisor
    restart: unless-stopped
    init: true
    ports:
      - "5002:5002"
    environment:
      - NODE_ENV=production
      - PORT=5002
      - API_URL=http://malintic_api:5001
      - DATA_DIR=/data
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - VERCEL_URL=${VERCEL_URL:-https://malintic-app.vercel.app}
      - NGROK_API_URL=http://malintic_ngrok:4040
    volumes:
      - malintic_data:/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - malintic_network

  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: malintic_tunnel
  #   restart: always
  #   init: true
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   networks:
  #     - malintic_network

volumes:
  malintic_data:
    driver: local

networks:
  malintic_network:
    driver: bridge
